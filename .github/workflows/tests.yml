name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-19, which has no Python 3.9
    # build for setup-python, and 3.9 is still the declared minimum.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # libusb is needed for `import usb.core` to succeed. No controller is
      # attached in CI, so only the pure-logic tests run -- which is all of
      # them: every payload builder and decoder is exercised through a fake
      # session (see tests/fakes.py).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: pip install -e ".[gui,dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
