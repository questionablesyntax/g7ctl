name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # libusb is needed for `import usb.core` to succeed. No controller is
      # attached in CI, so only the pure-logic tests run -- which is all of
      # them: every payload builder and decoder is exercised through a fake
      # session (see tests/fakes.py).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install package
        run: pip install -e ".[gui,dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      # tools/g7ctl-diag.sh has its own test file, on purpose -- it's bash,
      # not Python, so it can't run through unittest discovery above. No
      # new dependency: Ubuntu runners ship bash already, matching the
      # script's own "curl and run, nothing else installed" floor. Only
      # needs to run once, not once per Python version in the matrix.
      - name: Run g7ctl-diag.sh tests
        if: matrix.python-version == '3.13'
        run: bash tests/test_g7ctl_diag.sh
